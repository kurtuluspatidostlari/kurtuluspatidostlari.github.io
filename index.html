<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurtuluş Pati Dostları</title>
<meta name="description" content="Kurtuluş Pati Dostları – Her patiye bir yuva.">
<style>
  :root { --green:#123f2c; --green-deep:#0b2a1d; --gold:#e3bd5a; --cream:#f7f3ea; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    display:flex; align-items:center; justify-content:center;
    padding:32px 24px; text-align:center;
    background:radial-gradient(circle at 50% 30%, var(--green) 0%, var(--green-deep) 100%);
    color:var(--cream);
    font-family:Georgia, "Times New Roman", serif;
  }
  main { max-width:520px; }
  .paws { font-size:28px; letter-spacing:14px; margin-bottom:28px; opacity:.9; }
  h1 { font-size:clamp(34px, 9vw, 54px); line-height:1.1; font-weight:700; }
  h1 span { display:block; font-weight:400; font-size:.62em; margin-top:6px; }
  .slogan { margin-top:22px; font-style:italic; font-size:clamp(20px, 5.5vw, 26px); color:var(--gold); }
  .rule { width:64px; height:2px; background:var(--gold); margin:30px auto; opacity:.7; }
  .soon { font-family:system-ui, -apple-system, "Segoe UI", sans-serif; font-size:17px; line-height:1.6; }
  .soon strong { display:block; font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
</style>
</head>
<body>
<main>
  <div class="paws" aria-hidden="true">🐾🐾🐾</div>
  <h1>KURTULUŞ <span>Pati Dostları</span></h1>
  <p class="slogan">Her patiye bir yuva</p>
  <div class="rule"></div>
  <p class="soon"><strong>Çok yakında</strong>Sahiplenmeyi bekleyen dostlarımız, bağış ve iletişim bilgilerimiz yakında bu sayfada olacak.</p>
</main>
</body>
</html>
